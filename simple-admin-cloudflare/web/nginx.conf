# Simple Admin 前端 Nginx 配置
#
# 生产环境的请求链路：
#   浏览器 → Nginx(80)
#              ├─ 页面请求 /system/user → 返回 index.html（单页应用由前端路由接管）
#              └─ 接口请求 /api/xxx     → 反向代理给 Go 后端容器 http://server:8888
#
# 因为页面和接口都在同一个 Nginx 域名下，浏览器看来完全没有跨域问题。

server {
    listen 80;
    server_name _;

    # gzip 压缩静态资源，加快传输
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---------- 前端页面 ----------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # try_files：单页应用（SPA）的关键配置。
        # 前端路由（如 /system/user）在服务器上并没有对应文件，
        # 全部回退到 index.html，交给 Vue Router 在浏览器端渲染。
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端接口反向代理 ----------
    location /api/ {
        # server 是 docker-compose 里后端服务的名字（同一网络内用服务名互相访问）
        proxy_pass http://server:8888;

        # 把客户端的真实 IP 和协议传给后端（记录日志、判断 http/https 时需要）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
